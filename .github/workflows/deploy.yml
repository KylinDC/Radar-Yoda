name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys at once, and don't cancel one that is already shipping.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # The custom domain from wrangler.jsonc. `workers_dev` is disabled, so there
  # is no *.workers.dev hostname to fall back on — this is the canonical URL.
  PUBLIC_URL: https://radar-yoda.121314.best

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerate volumes manifest
        run: npm run gen:volumes

      # Catches a volume JSON being added without the generated manifest being
      # committed, which would silently ship an index missing that volume.
      # `git status --porcelain` rather than `git diff`: it also catches the
      # manifest being missing from the repository entirely, which plain
      # `git diff --quiet` reports as clean.
      - name: Check the volumes manifest is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/generated/volumes.ts)" ]; then
            echo "::error::src/generated/volumes.ts is stale or untracked. Run 'npm run gen:volumes' and commit the result."
            git --no-pager diff -- src/generated/volumes.ts
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run check

  deploy:
    name: Deploy
    needs: verify
    # Deploy from main only, and never from a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The unit tests and `wrangler deploy --dry-run` never execute the bundle,
      # so this is the only step that proves the Worker actually boots in the
      # Workers runtime and answers MCP requests. Smoke-tests the custom domain
      # rather than the action's deployment URL, because that URL is empty when
      # `workers_dev` is false. The script retries for ~30s to ride out DNS.
      - name: Smoke test the deployment
        run: npm run smoke -- "${{ env.PUBLIC_URL }}"

      # Runs even when the smoke test fails, so the URL is always recorded.
      - name: Summary
        if: always()
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: ${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "MCP endpoint: ${PUBLIC_URL}/mcp" >> "$GITHUB_STEP_SUMMARY"
